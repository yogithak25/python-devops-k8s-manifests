apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-devops-automation-app
  template:
    metadata:
      labels:
        app: python-devops-automation-app
    spec:
      containers:
      - name: python-app-container
        image: yogithak/python-devops-automation-project:4
        ports:
        - containerPort: 5000
